name: Build Windows Installer (PC)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar (genera jar en build/libs)
        shell: pwsh
        run: |
          ./gradlew jar --no-daemon
          Write-Host "=== Contenido build\libs ==="
          Get-ChildItem build\libs | Select-Object Name,Length

      - name: Crear runtime image (jlink + JavaFX nativo win)
        shell: pwsh
        run: |
          $jfx = "javafx-jmods-21.0.5"
          jlink --module-path "$jfx;$env:JAVA_HOME\jmods" `
                --add-modules javafx.base,javafx.graphics,javafx.controls,javafx.fxml,org.xerial.sqlitejdbc,java.logging `
                --strip-debug --no-header-files --no-man-pages `
                --output runtime

      - name: Preparar input (jar app + deps)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force input | Out-Null
          Get-ChildItem build\libs\*.jar | Copy-Item -Destination input\

      - name: Empaquetar MSI + portable
        shell: pwsh
        run: |
          $mainJar = (Get-ChildItem build\libs\*.jar | Select-Object -First 1).Name
          jpackage --type msi --name "GCI" --app-version 1.0.0 `
                  --runtime-image runtime --input input `
                  --main-jar $mainJar --main-class cu.lazaroysr96.gci.MainApp `
                  --win-menu
          jpackage --type app-image --name "GCI-portable" `
                  --runtime-image runtime --input input `
                  --main-jar $mainJar --main-class cu.lazaroysr96.gci.MainApp
          Get-ChildItem *.msi

      - name: Subir instalador MSI
        uses: actions/upload-artifact@v4
        with:
          name: GCI-Windows-MSI
          path: '*.msi'

      - name: Subir portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GCI-Windows-Portable
          path: 'GCI-portable'
